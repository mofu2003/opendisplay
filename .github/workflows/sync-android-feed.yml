name: Sync Android update feed

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-update-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: android-actions/setup-android@v3

      - name: Install aapt
        run: sdkmanager "build-tools;36.0.0" >/dev/null

      - name: Rebuild public/android-version.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/release/sync_update_feeds.py --platform android

      - name: Commit the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/android-version.json
          if git diff --cached --quiet; then
            echo "Android update feed is unchanged"
            exit 0
          fi
          git commit -m "chore(release): sync Android update feed [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
