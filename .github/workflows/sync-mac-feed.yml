name: Sync macOS update feeds

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: publish-update-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Download Sparkle signing tools
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_TOOLS_VERSION: "2.6.4"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          find "$RUNNER_TEMP/sparkle" -name generate_appcast -type f | head -1 > "$RUNNER_TEMP/generator-path"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_priv"

      - name: Rebuild the Sparkle appcasts
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/release/sync_update_feeds.py \
            --platform mac \
            --sparkle-generator "$(cat "$RUNNER_TEMP/generator-path")" \
            --sparkle-key-file "$RUNNER_TEMP/sparkle_ed_priv"

      - name: Report missing signing key
        if: ${{ env.SPARKLE_PRIVATE_KEY == '' }}
        run: echo "::warning::SPARKLE_PRIVATE_KEY is not set; macOS feeds were not refreshed."

      - name: Commit the feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/appcast.xml public/appcast-receiver.xml
          if git diff --cached --quiet; then
            echo "macOS update feeds are unchanged"
            exit 0
          fi
          git commit -m "chore(release): sync macOS update feeds [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
